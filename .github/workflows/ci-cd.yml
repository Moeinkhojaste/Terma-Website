name: Terma CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Automated Quality & Unit/Integration Checks
  # ============================================================================
  frontend:
    name: Frontend Quality & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Locked Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: TypeScript Type-Check
        run: npm run typecheck

      - name: Unit & Component Tests (Vitest)
        run: npm test

      - name: Production Build Verification
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://api.terma.ir"
        run: npm run build

  backend:
    name: Backend Quality & Test Suite
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore Dependencies
        run: dotnet restore Terma.sln

      - name: Build with Warnings as Errors
        run: dotnet build Terma.sln --configuration Release --no-restore --warnaserror

      - name: Run Unit and Integration Tests
        run: dotnet test Terma.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.sha }}
          path: backend/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  architecture:
    name: Architecture & Boundary Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Clean Architecture Rules & Project Decoupling
        shell: pwsh
        run: |
          $root = (Get-Location).Path

          if (Test-Path -LiteralPath (Join-Path $root 'src')) {
            throw 'A shared root-level src directory is not allowed.'
          }

          $frontend = Join-Path $root 'frontend'
          $backend = Join-Path $root 'backend'
          if (-not (Test-Path -LiteralPath $frontend) -or -not (Test-Path -LiteralPath $backend)) {
            throw 'Both independent frontend and backend applications must exist.'
          }

          $projects = @{}
          Get-ChildItem -Path (Join-Path $backend 'src') -Filter '*.csproj' -Recurse | ForEach-Object {
            $projects[$_.BaseName] = $_.FullName
          }

          function Get-ProjectReferences([string] $path) {
            [xml]$xml = Get-Content -LiteralPath $path
            $includes = @($xml.Project.ItemGroup.ProjectReference.Include | Where-Object { $null -ne $_ -and $_ -ne '' })
            return @($includes | ForEach-Object {
              [IO.Path]::GetFileNameWithoutExtension((Split-Path $_ -Leaf))
            })
          }

          $allowed = @{
            'Terma.Domain' = @()
            'Terma.Application' = @('Terma.Domain')
            'Terma.Infrastructure' = @('Terma.Application', 'Terma.Domain')
            'Terma.Api' = @('Terma.Application', 'Terma.Infrastructure')
          }

          foreach ($name in $allowed.Keys) {
            $actual = @(Get-ProjectReferences $projects[$name] | Sort-Object)
            $expected = @($allowed[$name] | Sort-Object)
            if (($actual -join '|') -ne ($expected -join '|')) {
              throw "$name has invalid project references. Expected: $($expected -join ', '); actual: $($actual -join ', ')."
            }
          }

          $frontendProjectReferences = Get-ChildItem -Path $frontend -Filter '*.csproj' -Recurse -ErrorAction SilentlyContinue
          if ($null -ne $frontendProjectReferences) {
            throw 'Frontend must not contain .NET projects.'
          }

          Write-Host 'Repository boundaries and project dependency direction are valid.'

  # ============================================================================
  # 2. End-to-End Storefront Tests (Playwright)
  # ============================================================================
  e2e:
    name: End-to-End Storefront Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend, architecture]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Password2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password2026' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password2026' -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Frontend Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:5442"
        run: npm run build

      - name: Migrate Database Schema
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: "Development"
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=TermaDb_E2E;User Id=sa;Password=YourStrong!Password2026;TrustServerCertificate=True"
        run: dotnet run --project backend/src/Terma.Api -- --migrate

      - name: Start Backend Web API
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: "Development"
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=TermaDb_E2E;User Id=sa;Password=YourStrong!Password2026;TrustServerCertificate=True"
        run: |
          dotnet run --project backend/src/Terma.Api --urls "http://127.0.0.1:5442" &
          echo "Waiting for Backend API on port 5442..."
          for i in {1..45}; do
            if curl -s -f http://127.0.0.1:5442/health/ready 2>/dev/null | grep -q '"Healthy"'; then
              echo "Backend API is ready."
              break
            fi
            sleep 1
          done

      - name: Run Critical Smoke E2E Tests (PR / develop)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:5442"
        run: npx playwright test e2e/full-purchase-journey.spec.ts --project=desktop-chromium

      - name: Run Full Cross-Browser E2E Suite (main / release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:5442"
        run: npx playwright test

      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ============================================================================
  # 3. Real SQL Server 2022 Schema Migration & Concurrency Validation
  # ============================================================================
  sqlserver-integration:
    name: SQL Server 2022 Schema & Concurrency Validation
    runs-on: ubuntu-latest
    needs: [backend, architecture]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Password2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password2026' -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore Dependencies
        working-directory: backend
        run: dotnet restore Terma.sln

      - name: Apply EF Core Migrations on Fresh SQL Server Database
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=TermaDb_CI;User Id=sa;Password=YourStrong!Password2026;TrustServerCertificate=True"
        run: dotnet run --project src/Terma.Api -- --migrate

      - name: Run Concurrency & Integration Tests against SQL Server 2022
        working-directory: backend
        env:
          TEST_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;Database=TermaDb_CI;User Id=sa;Password=YourStrong!Password2026;TrustServerCertificate=True"
        run: dotnet test tests/Terma.IntegrationTests/Terma.IntegrationTests.csproj --configuration Release --logger "trx;LogFileName=sqlserver-test-results.trx"

  # ============================================================================
  # 4. Automated Staging Deployment (develop branch)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging Environment
    needs: [frontend, backend, architecture, e2e, sqlserver-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN || 'staging.terma.ir' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Staging via SSH (deployer user)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_DEPLOY_USER || 'deployer' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/terma/staging
            git fetch origin develop
            git checkout ${{ github.sha }}
            bash scripts/deploy-staging.sh ${{ github.sha }}

  # ============================================================================
  # 5. Production Deployment with Environment Approval Gate (main branch)
  # ============================================================================
  deploy-production:
    name: Deploy to Production Environment
    needs: [frontend, backend, architecture, e2e, sqlserver-integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN || 'terma.ir' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Production via SSH (deployer user)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_DEPLOY_USER || 'deployer' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/terma/production
            git fetch origin main
            git checkout ${{ github.sha }}
            bash scripts/deploy-prod.sh ${{ github.sha }}
