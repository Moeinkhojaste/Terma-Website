# ==============================================================================
# Terma Staging Virtual Host Configuration
# Includes HTTP Basic Auth Protection & Strict NoIndex Headers
# ==============================================================================

# Staging HTTP Server (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name staging.termabrand.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Staging Headers
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Environment "staging" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Staging Backend API Routing
    location /api/ {
        set $staging_backend "staging-backend:8080";
        proxy_pass http://$staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Staging Health Checks
    location /health/ {
        auth_basic off;
        set $staging_backend "staging-backend:8080";
        proxy_pass http://$staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Swagger Documentation
    location /swagger {
        set $staging_backend "staging-backend:8080";
        proxy_pass http://$staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Next.js Static Asset Caching
    location /_next/static/ {
        set $staging_frontend "staging-frontend:3000";
        proxy_pass http://$staging_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }

    # Staging Storefront Catch-all
    location / {
        set $staging_frontend "staging-frontend:3000";
        proxy_pass http://$staging_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# Staging HTTPS Server (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.termabrand.ir;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/live/staging.termabrand.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/staging.termabrand.ir/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:StageSSL:5m;
    ssl_session_tickets off;

    # Staging Headers
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Environment "staging" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Staging Backend API Routing
    location /api/ {
        set $staging_backend "staging-backend:8080";
        proxy_pass http://$staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Staging Health Checks
    location /health/ {
