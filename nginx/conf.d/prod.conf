# ==============================================================================
# Terma Production Virtual Host Configuration
# Supports both direct HTTPS (Port 443) and CDN Reverse Proxy (Port 80/443)
# ==============================================================================

# HTTP Server (Port 80 - Handles CDN Origin Traffic & ACME Challenge)
server {
    listen 80;
    listen [::]:80;
    server_name termabrand.ir www.termabrand.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Backend API Routing with Rate Limiting
    location /api/ {
        limit_req zone=api_general burst=15 nodelay;

        set $prod_backend "prod-backend:8080";
        proxy_pass http://$prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Strict Rate Limiting on Authentication Endpoints
    location /api/auth/login {
        limit_req zone=auth_strict burst=3 nodelay;

        set $prod_backend "prod-backend:8080";
        proxy_pass http://$prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health Checks
    location /health/ {
        set $prod_backend "prod-backend:8080";
        proxy_pass http://$prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Media Storage Static Files
    location /media/ {
        set $prod_backend "prod-backend:8080";
        proxy_pass http://$prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Next.js Static Asset Caching
    location /_next/static/ {
        set $prod_frontend "prod-frontend:3000";
        proxy_pass http://$prod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Next.js App Router Storefront
    location / {
        set $prod_frontend "prod-frontend:3000";
        proxy_pass http://$prod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Production HTTPS Server (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name termabrand.ir www.termabrand.ir;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/live/termabrand.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/termabrand.ir/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ProdSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Backend API Routing with Rate Limiting
    location /api/ {
        limit_req zone=api_general burst=15 nodelay;

        set $prod_backend "prod-backend:8080";
        proxy_pass http://$prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Strict Rate Limiting on Authentication Endpoints
